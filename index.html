<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rajongoi TCG</title>
  <meta name="description" content="Duel Masters-style card game with Riftbound mechanics — play against the AI and browse the OGN and DND sets.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">RAJONGOI TCG</a>
    <nav>
      <a href="#/play" data-nav="play">Play vs AI</a>
      <a href="#/collection" data-nav="collection">Collection</a>
      <a href="#/decks" data-nav="decks">Decks</a>
      <a href="#/boosters" data-nav="boosters">Boosters</a>
      <a href="#/achievements" data-nav="achievements">Achievements</a>
      <a href="#/rules" data-nav="rules">Rules</a>
    </nav>
    <span class="spacer"></span>
    <button id="mute" class="ghost mute-btn" title="Sound on/off" aria-label="Sound on/off">🔊</button>
  </header>
  <main id="app"><div class="page muted">Loading cards…</div></main>
  <script>
    window.addEventListener('error', function (e) {
      var app = document.getElementById('app');
      if (app && /Loading/.test(app.textContent)) app.innerHTML = '<div class="page"><h2>Something went wrong</h2><p class="muted">' + (e.message || e) + '</p></div>';
    });
  </script>
  <!-- Generated bundles (npm run build). Classic scripts so it also runs from file:// -->
  <script src="data/data.js"></script>
  <script src="js/bundle.js"></script>
</body>
</html>
